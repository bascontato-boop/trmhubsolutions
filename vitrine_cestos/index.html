<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine de Produtos - TRM HUB</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
            background: #001f3f;
            color: white;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        header p {
            color: #0074d9;
            font-weight: bold;
        }

        /* Container dos Produtos */
        .vitrine-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
            min-height: 200px;
        }

        /* Card do Produto */
        .produto-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .produto-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }

        .img-container {
            width: 100%;
            height: 220px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        .img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        .produto-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .produto-info h3 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #222;
            min-height: 44px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .produto-info .preco {
            font-size: 1.4rem;
            color: #2ecc71;
            font-weight: bold;
            margin-bottom: 15px;
            margin-top: auto;
        }

        .btn-comprar {
            display: block;
            text-align: center;
            background: #0074d9;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-comprar:hover {
            background: #0056b3;
        }

        /* Status Mensagens */
        .status-mensagem {
            width: 100%;
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 0;
            font-size: 1.2rem;
            color: #666;
        }
    </main>
    </style>
</head>
<body>

    <header>
        <h1>TRM HUB</h1>
        <p>As melhores ofertas e recomendações técnicas</p>
    </header>

    <main class="vitrine-container" id="vitrine">
        <div class="status-mensagem" id="mensagem-status">
            Carregando produtos da vitrine...
        </div>
    </main>

    <script>
        setTimeout(async function carregarProdutos() {
            const vitrineContainer = document.getElementById("vitrine");
            const mensagemStatus = document.getElementById("mensagem-status");

            if (!vitrineContainer) return;

            try {
                // Realiza a chamada segura para a API do servidor Netlify
                const response = await fetch('/api').catch(e => {
                    throw new Error("Não foi possível conectar à rota /api. Verifique o arquivo netlify.toml.");
                });
                
                // Validação para impedir loops de redirecionamento caso falte o arquivo .toml
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.includes("text/html")) {
                    throw new Error("A rota /api retornou uma página HTML em vez de dados JSON. O mapeamento do Netlify falhou.");
                }

                const produtos = await response.json();

                // Caso a lista de produtos retorne vazia do banco
                if (!produtos || produtos.length === 0) {
                    if (mensagemStatus) {
                        mensagemStatus.textContent = "Nenhum produto cadastrado na vitrine no momento.";
                    } else {
                        vitrineContainer.innerHTML = `<div class="status-mensagem">Nenhum produto cadastrado na vitrine no momento.</div>`;
                    }
                    return;
                }

                // Limpa o esqueleto ou texto de carregamento da tela antes de injetar os itens
                vitrineContainer.innerHTML = "";

                // Varre a array de produtos e monta cada um deles de forma dinâmica
                produtos.forEach(produto => {
                    const nome = produto.nome || "Produto sem título";
                    const preco = produto.preco || "0,00";
                    const plataforma = produto.plataforma || "Oferta";
                    
                    // CORREÇÃO CRÍTICA: Mapeia todas as variações de chaves possíveis vindas do produtos.json
                    const urlImagem = produto.urlImagem || produto.url_imagem || produto.imagem || "https://via.placeholder.com/220";
                    const linkAfiliado = produto.linkAfiliado || produto.link_afiliado || produto.link || "#";

                    const cardHtml = `
                        <div class="produto-card">
                            <div class="img-container">
                                <img src="${urlImagem}" alt="${nome}" onerror="this.src='https://via.placeholder.com/220';">
                            </div>
                            <div class="produto-info">
                                <h3>${nome}</h3>
                                <p class="preco">R$ ${preco}</p>
                                <a href="${linkAfiliado}" target="_blank" class="btn-comprar">
                                    Comprar no ${plataforma}
                                </a>
                            </div>
                        </div>
                    `;
                    vitrineContainer.insertAdjacentHTML('beforeend', cardHtml);
                });

            } catch (error) {
                console.error("Erro no processamento dos dados da vitrine:", error);
                if (vitrineContainer) {
                    vitrineContainer.innerHTML = `
                        <div class="status-mensagem" style="color: #ff4d4d; font-weight: bold; background: white; padding: 20px; border-radius: 8px; border: 1px dashed #ff4d4d; max-width: 600px; margin: 0 auto;">
                            Aviso no carregamento dos dados:<br>
                            <small style="color: #666; font-weight: normal; font-size: 0.9rem;">${error.message}</small>
                        </div>
                    `;
                }
            }
        }, 300);
    </script>
</body>
</html>
