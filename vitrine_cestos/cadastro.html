<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | TRM Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Tela de Login -->
    <div id="login-overlay" class="fixed inset-0 bg-gray-900 bg-opacity-80 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-sm">
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Acesso Restrito</h2>
            <form id="login-form">
                <div class="mb-4">
                    <label for="login-user" class="block text-sm font-medium text-gray-600 mb-1">Usuário</label>
                    <input type="text" id="login-user" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500" required>
                </div>
                <div class="mb-6">
                    <label for="login-pass" class="block text-sm font-medium text-gray-600 mb-1">Senha</label>
                    <input type="password" id="login-pass" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500" required>
                </div>
                <div id="login-erro" class="hidden text-red-600 text-sm text-center mb-4"></div>
                <button type="submit" class="w-full bg-cyan-600 text-white py-2 rounded-md hover:bg-cyan-700 transition-colors font-semibold">Entrar</button>
            </form>
        </div>
    </div>

    <!-- Conteúdo do Painel -->
    <div id="painel-conteudo" class="hidden container mx-auto p-4 md:p-8">
        <header class="flex justify-between items-center mb-8 pb-4 border-b border-gray-200">
            <h1 class="text-3xl font-bold text-gray-800">Painel de Produtos</h1>
            <button onclick="logout()" class="text-sm font-medium text-gray-500 hover:text-red-600">Sair</button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Coluna do Formulário -->
            <div class="lg:col-span-1 bg-white p-6 rounded-lg shadow-md border border-gray-200 h-fit">
                <h2 id="form-title" class="text-xl font-semibold mb-6">Cadastrar Novo Produto</h2>
                <form id="produto-form" class="space-y-4">
                    <input type="hidden" id="produto-id">
                    <div>
                        <label for="nome" class="block text-sm font-medium text-gray-600">Nome do Produto</label>
                        <input type="text" id="nome" class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:ring-1 focus:ring-cyan-500" required>
                    </div>
                    <div>
                        <label for="preco" class="block text-sm font-medium text-gray-600">Preço (ex: 29.90)</label>
                        <input type="text" id="preco" class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:ring-1 focus:ring-cyan-500" required>
                    </div>
                    <div>
                        <label for="plataforma" class="block text-sm font-medium text-gray-600">Plataforma (ex: Mercado Livre)</label>
                        <input type="text" id="plataforma" class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:ring-1 focus:ring-cyan-500" required>
                    </div>
                    <div>
                        <label for="link" class="block text-sm font-medium text-gray-600">Link de Compra</label>
                        <input type="url" id="link" class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:ring-1 focus:ring-cyan-500" required>
                    </div>
                    <div>
                        <label for="imagem" class="block text-sm font-medium text-gray-600">URL da Imagem</label>
                        <input type="url" id="imagem" class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:ring-1 focus:ring-cyan-500" required>
                    </div>
                    <div class="flex items-center gap-3 pt-4">
                        <button type="submit" id="btn-salvar" class="w-full bg-cyan-600 text-white py-2 px-4 rounded-md hover:bg-cyan-700 font-semibold transition-colors">Salvar Produto</button>
                        <button type="button" id="btn-cancelar" onclick="resetarFormulario()" class="hidden w-full bg-gray-200 text-gray-700 py-2 px-4 rounded-md hover:bg-gray-300 font-semibold transition-colors">Cancelar</button>
                    </div>
                </form>
            </div>

            <!-- Coluna da Tabela -->
            <div class="lg:col-span-2 bg-white p-6 rounded-lg shadow-md border border-gray-200">
                <h2 class="text-xl font-semibold mb-6">Produtos Cadastrados</h2>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Produto</th>
                                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Plataforma</th>
                                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Preço</th>
                                <th class="px-4 py-3 text-right text-xs font-semibold text-gray-500 uppercase tracking-wider">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-produtos" class="bg-white divide-y divide-gray-200">
                            <!-- Linhas inseridas via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let produtosExistentes = [];

        // --- NOVO: Helper para obter o ID da vitrine a partir da URL ---
        function getVitrineId() {
            // Ex: /vitrine_beleza/cadastro.html -> vitrine_beleza
            const pathParts = window.location.pathname.split('/').filter(part => part);
            // Retorna o penúltimo segmento, que deve ser o nome da pasta
            return pathParts.length > 1 ? pathParts[pathParts.length - 2] : 'vitrine';
        }
        const vitrineId = getVitrineId();
        // -----------------------------------------------------------------

        document.addEventListener('DOMContentLoaded', checarSessao);
        document.getElementById('login-form').addEventListener('submit', efetuarLogin);
        document.getElementById('produto-form').addEventListener('submit', salvarItem);

        function checarSessao() {
            const token = sessionStorage.getItem('trm_token');
            if (token === "trm-authenticated-session-2026") {
                document.getElementById('login-overlay').classList.add('hidden');
                document.getElementById('painel-conteudo').classList.remove('hidden');
                listarGerenciador();
            }
        }

        async function efetuarLogin(e) {
            e.preventDefault();
            const usuario = document.getElementById('login-user').value;
            const senha = document.getElementById('login-pass').value;
            const erroDiv = document.getElementById('login-erro');

            try {
                // ATUALIZADO: login não precisa de vitrineId, continua igual
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, senha })
                });
                const data = await response.json();
                if (response.ok && data.autenticado) {
                    sessionStorage.setItem('trm_token', data.token);
                    erroDiv.classList.add('hidden');
                    checarSessao();
                } else {
                    erroDiv.innerText = data.message || "Erro ao autenticar.";
                    erroDiv.classList.remove('hidden');
                }
            } catch (error) {
                erroDiv.innerText = "Erro ao conectar com o servidor.";
                erroDiv.classList.remove('hidden');
            }
        }

        function logout() {
            sessionStorage.removeItem('trm_token');
            window.location.reload();
        }

        async function listarGerenciador() {
            const tbody = document.getElementById('tabela-produtos');
            try {
                // ATUALIZADO: Adiciona o parâmetro vitrineId
                const response = await fetch(`/api?vitrine=${vitrineId}`);
                produtosExistentes = await response.json();
                if (!produtosExistentes || produtosExistentes.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-gray-400">Nenhum produto cadastrado ainda.</td></tr>`;
                    return;
                }
                tbody.innerHTML = produtosExistentes.map(p => `
                    <tr>
                        <td class="py-3 px-4 flex items-center gap-3">
                            <img src="${p.imagem}" class="w-10 h-10 object-cover rounded border" onerror="this.src='https://placehold.co/40x40?text=Erro'">
                            <span class="font-medium text-gray-800 truncate max-w-[180px]">${p.nome}</span>
                        </td>
                        <td class="py-3 px-4 text-gray-500 text-sm">${p.plataforma}</td>
                        <td class="py-3 px-4 font-semibold text-gray-700">R$ ${parseFloat(p.preco).toFixed(2)}</td>
                        <td class="py-3 px-4 text-right space-x-2">
                            <button onclick="prepararEdicao('${p.id}')" class="text-cyan-600 hover:text-cyan-800 font-medium text-xs">Editar</button>
                            <button onclick="deletarItem('${p.id}')" class="text-red-600 hover:text-red-800 font-medium text-xs">Excluir</button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-red-500">Erro ao carregar dados.</td></tr>`;
            }
        }

        async function salvarItem(e) {
            e.preventDefault();
            const id = document.getElementById('produto-id').value;
            const token = sessionStorage.getItem('trm_token');
            const dados = {
                nome: document.getElementById('nome').value,
                preco: document.getElementById('preco').value,
                plataforma: document.getElementById('plataforma').value,
                link: document.getElementById('link').value,
                imagem: document.getElementById('imagem').value
            };

            // ATUALIZADO: Adiciona o parâmetro vitrineId
            const url = id ? `/api/${id}?vitrine=${vitrineId}` : `/api?vitrine=${vitrineId}`;
            const method = id ? 'PUT' : 'POST';

            document.getElementById('btn-salvar').innerText = "Salvando...";
            document.getElementById('btn-salvar').disabled = true;

            try {
                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json', 'Authorization': token },
                    body: JSON.stringify(dados)
                });
                if (response.ok) {
                    resetarFormulario();
                    await listarGerenciador();
                } else {
                    alert('Erro ao salvar os dados.');
                }
            } catch (error) {
                alert('Erro de conexão.');
            } finally {
                document.getElementById('btn-salvar').disabled = false;
            }
        }

        function prepararEdicao(id) {
            const p = produtosExistentes.find(prod => prod.id === id);
            if (!p) return;
            document.getElementById('produto-id').value = p.id;
            document.getElementById('nome').value = p.nome;
            document.getElementById('preco').value = p.preco;
            document.getElementById('plataforma').value = p.plataforma;
            document.getElementById('link').value = p.link;
            document.getElementById('imagem').value = p.imagem;
            document.getElementById('form-title').innerText = "Editar Produto";
            document.getElementById('btn-salvar').innerText = "Atualizar Mudanças";
            document.getElementById('btn-cancelar').classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        async function deletarItem(id) {
            if (!confirm('Deseja realmente remover este produto?')) return;
            const token = sessionStorage.getItem('trm_token');
            try {
                // ATUALIZADO: Adiciona o parâmetro vitrineId
                const response = await fetch(`/api/${id}?vitrine=${vitrineId}`, { method: 'DELETE', headers: { 'Authorization': token } });
                if (response.ok) await listarGerenciador();
            } catch (error) {
                alert('Erro ao deletar o produto.');
            }
        }

        function resetarFormulario() {
            document.getElementById('produto-form').reset();
            document.getElementById('produto-id').value = '';
            document.getElementById('form-title').innerText = "Cadastrar Novo Produto";
            document.getElementById('btn-salvar').innerText = "Salvar Produto";
            document.getElementById('btn-cancelar').classList.add('hidden');
        }
    </script>
</body>
</html>
