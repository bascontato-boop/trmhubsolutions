<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine de Produtos - TRM HUB</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 20px; }
        header { text-align: center; padding: 30px 0; background: #001f3f; color: white; border-radius: 8px; margin-bottom: 30px; }
        header h1 { font-size: 2.5rem; margin-bottom: 5px; }
        .vitrine-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .status-mensagem { width: 100%; text-align: center; padding: 40px 0; font-size: 1.2rem; color: #666; }
    </style>
</head>
<body>

    <header>
        <h1>TRM HUB</h1>
        <p>As melhores ofertas e recomendações técnicas</p>
    </header>

    <main class="vitrine-container" id="vitrine">
        <div class="status-mensagem" id="mensagem-status">
            Carregando produtos da vitrine...
        </div>
    </main>

    <script>
        // Execução protegida contra loops e travamentos de rota
        setTimeout(async function carregarProdutos() {
            const vitrineContainer = document.getElementById("vitrine");
            const mensagemStatus = document.getElementById("mensagem-status");

            try {
                // Chama a API de forma segura
                const response = await fetch('/api').catch(e => {
                    throw new Error("Não foi possível conectar à rota /api. Verifique o netlify.toml.");
                });
                
                // Se a API retornar uma página HTML em vez de JSON (Redirecionamento incorreto)
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.includes("text/html")) {
                    throw new Error("A rota /api retornou um HTML em vez de dados. O redirecionamento do Netlify falhou.");
                }

                const produtos = await response.json();

                if (!produtos || produtos.length === 0) {
                    mensagemStatus.textContent = "Nenhum produto cadastrado na vitrine no momento.";
                    return;
                }

                vitrineContainer.innerHTML = "";

                produtos.forEach(produto => {
                    const nome = produto.nome || "Produto sem título";
                    const preco = produto.preco || "0,00";
                    const urlImagem = produto.urlImagem || "https://via.placeholder.com/220";
                    const linkAfiliado = produto.linkAfiliado || "#";

                    const cardHtml = `
                        <div style="background:white; padding:20px; border-radius:8px; box-shadow:0 4px 6px rgba(0,0,0,0.05);">
                            <img src="${urlImagem}" style="max-width:100%; height:180px; object-fit:contain; display:block; margin:0 auto 15px;">
                            <h3 style="font-size:1.1rem; margin-bottom:10px;">${nome}</h3>
                            <p style="color:#2ecc71; font-weight:bold; font-size:1.3rem; margin-bottom:15px;">R$ ${preco}</p>
                            <a href="${linkAfiliado}" target="_blank" style="display:block; text-align:center; background:#0074d9; color:white; padding:10px; text-decoration:none; border-radius:5px; font-weight:bold;">Comprar</a>
                        </div>
                    `;
                    vitrineContainer.insertAdjacentHTML('beforeend', cardHtml);
                });

            } catch (error) {
                console.error("Erro capturado:", error);
                if (mensagemStatus) {
                    mensagemStatus.innerHTML = `
                        <div style="color: #ff4d4d; padding: 20px; background: #fff; border-radius: 8px; border: 1px dashed #ff4d4d;">
                            <strong>Aviso no carregamento dos dados:</strong><br>
                            <span style="font-size:0.95rem; color:#555;">${error.message}</span>
                        </div>
                    `;
                }
            }
        }, 500); // Pequeno delay de segurança para garantir a árvore DOM pronta
    </script>
</body>
</html>
