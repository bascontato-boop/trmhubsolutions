<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador - TRM Hub Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <div id="login-overlay" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-xl shadow-xl border border-gray-200 w-full max-w-sm">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold tracking-wider text-slate-900">TRM HUB <span class="text-cyan-600 text-sm font-light block">Painel Administrativo</span></h1>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Usuário</label>
                    <input type="text" id="login-user" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-cyan-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                    <input type="password" id="login-pass" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-cyan-500 outline-none">
                </div>
                <div id="login-erro" class="text-red-500 text-xs hidden text-center font-medium"></div>
                <button type="submit" class="w-full bg-slate-950 hover:bg-slate-800 text-white font-medium py-2.5 rounded-lg text-sm transition">Entrar no Painel</button>
            </form>
        </div>
    </div>

    <div id="painel-conteudo" class="hidden">
        <header class="bg-slate-900 text-white shadow-md py-4">
            <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
                <h1 class="text-xl font-bold text-cyan-400">Painel TRM HUB</h1>
                <div class="flex items-center gap-4">
                    <a href="index.html" class="text-sm bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg border border-slate-700">Ver Vitrine</a>
                    <button onclick="logout()" class="text-sm text-red-400 hover:text-red-300 font-medium">Sair</button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 h-fit">
                <h2 id="form-title" class="text-lg font-bold text-gray-800 mb-4">Cadastrar Novo Produto</h2>
                <form id="produto-form" class="space-y-4">
                    <input type="hidden" id="produto-id">
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nome do Produto</label>
                        <input type="text" id="nome" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-cyan-500 outline-none">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Preço (R$)</label>
                            <input type="number" step="0.01" id="preco" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-cyan-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Plataforma</label>
                            <select id="plataforma" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-cyan-500 outline-none">
                                <option value="Mercado Livre">Mercado Livre</option>
                                <option value="Shopee">Shopee</option>
                                <option value="Outro">Outro</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Link de Afiliado</label>
                        <input type="url" id="link" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-cyan-500 outline-none" placeholder="https://...">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">URL da Imagem</label>
                        <input type="url" id="imagem" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-cyan-500 outline-none" placeholder="https://linkdaimagem.com/foto.jpg">
                    </div>

                    <div class="pt-2 flex gap-2">
                        <button type="submit" id="btn-salvar" class="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-medium py-2.5 rounded-lg text-sm transition">Salvar Produto</button>
                        <button type="button" id="btn-cancelar" onclick="resetarFormulario()" class="hidden w-1/3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2.5 rounded-lg text-sm transition">Cancelar</button>
                    </div>
                </form>
            </div>

            <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-lg font-bold text-gray-800 mb-4">Produtos Cadastrados</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-gray-200 text-gray-500 text-xs uppercase tracking-wider">
                                <th class="pb-3 font-semibold">Item</th>
                                <th class="pb-3 font-semibold">Plataforma</th>
                                <th class="pb-3 font-semibold">Preço</th>
                                <th class="pb-3 font-semibold text-right">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-produtos" class="divide-y divide-gray-100 text-sm">
                            </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        let produtosExistentes = [];

        document.addEventListener('DOMContentLoaded', checarSessao);
        document.getElementById('login-form').addEventListener('submit', efetuarLogin);
        document.getElementById('produto-form').addEventListener('submit', salvarItem);

        function checarSessao() {
            const token = sessionStorage.getItem('trm_token');
            if (token === "trm-authenticated-session-2026") {
                document.getElementById('login-overlay').classList.add('hidden');
                document.getElementById('painel-conteudo').classList.remove('hidden');
                listarGerenciador();
            }
        }

        async function efetuarLogin(e) {
            e.preventDefault();
            const usuario = document.getElementById('login-user').value;
            const senha = document.getElementById('login-pass').value;
            const erroDiv = document.getElementById('login-erro');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, senha })
                });
                
                const data = await response.json();
                
                if (response.ok && data.autenticado) {
                    sessionStorage.setItem('trm_token', data.token);
                    erroDiv.classList.add('hidden');
                    checarSessao();
                } else {
                    erroDiv.innerText = data.message || "Erro ao autenticar.";
                    erroDiv.classList.remove('hidden');
                }
            } catch (error) {
                erroDiv.innerText = "Erro ao conectar com o servidor.";
                erroDiv.classList.remove('hidden');
            }
        }

        function logout() {
            sessionStorage.removeItem('trm_token');
            window.location.reload();
        }

        // --- CRUD DE PRODUTOS ---

        async function listarGerenciador() {
            const tbody = document.getElementById('tabela-produtos');
            try {
                const response = await fetch('/api');
                produtosExistentes = await response.json();
                
                if (!produtosExistentes || produtosExistentes.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-gray-400">Nenhum produto cadastrado ainda.</td></tr>`;
                    return;
                }

                tbody.innerHTML = produtosExistentes.map(p => `
                    <tr>
                        <td class="py-3 flex items-center gap-3">
                            <img src="${p.imagem}" class="w-10 h-10 object-cover rounded border" onerror="this.src='https://placehold.co/40x40?text=Erro'">
                            <span class="font-medium text-gray-800 truncate max-w-[180px]">${p.nome}</span>
                        </td>
                        <td class="py-3 text-gray-500 text-xs">${p.plataforma}</td>
                        <td class="py-3 font-semibold text-gray-700">R$ ${parseFloat(p.preco).toFixed(2)}</td>
                        <td class="py-3 text-right space-x-2">
                            <button onclick="prepararEdicao('${p.id}')" class="text-cyan-600 hover:text-cyan-800 font-medium text-xs">Editar</button>
                            <button onclick="deletarItem('${p.id}')" class="text-red-600 hover:text-red-800 font-medium text-xs">Excluir</button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-red-500">Erro ao carregar dados.</td></tr>`;
            }
        }

        async function salvarItem(e) {
            e.preventDefault();
            const id = document.getElementById('produto-id').value;
            const token = sessionStorage.getItem('trm_token');
            
            const dados = {
                nome: document.getElementById('nome').value,
                preco: document.getElementById('preco').value,
                plataforma: document.getElementById('plataforma').value,
                link: document.getElementById('link').value,
                imagem: document.getElementById('imagem').value
            };

            const url = id ? `/api/${id}` : '/api';
            const method = id ? 'PUT' : 'POST';

            document.getElementById('btn-salvar').innerText = "Salvando no Repositório...";
            document.getElementById('btn-salvar').disabled = true;

            try {
                const response = await fetch(url, {
                    method,
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': token
                    },
                    body: JSON.stringify(dados)
                });
                if (response.ok) {
                    resetarFormulario();
                    await listarGerenciador();
                } else {
                    alert('Sua sessão expirou ou ocorreu um erro na validação.');
                    logout();
                }
            } catch (error) {
                alert('Erro de conexão com o servidor.');
            } finally {
                document.getElementById('btn-salvar').disabled = false;
            }
        }

        function prepararEdicao(id) {
            const p = produtosExistentes.find(prod => prod.id === id);
            if (!p) return;

            document.getElementById('produto-id').value = p.id;
            document.getElementById('nome').value = p.nome;
            document.getElementById('preco').value = p.preco;
            document.getElementById('plataforma').value = p.plataforma;
            document.getElementById('link').value = p.link;
            document.getElementById('imagem').value = p.imagem;

            document.getElementById('form-title').innerText = "Editar Produto";
            document.getElementById('btn-salvar').innerText = "Atualizar Mudanças";
            document.getElementById('btn-cancelar').classList.remove('hidden');
        }

        async function deletarItem(id) {
            if (!confirm('Deseja realmente remover este produto da vitrine?')) return;
            const token = sessionStorage.getItem('trm_token');
            try {
                const response = await fetch(`/api/${id}`, { 
                    method: 'DELETE',
                    headers: { 'Authorization': token }
                });
                if (response.ok) await listarGerenciador();
            } catch (error) {
                alert('Erro ao deletar produto.');
            }
        }

        function resetarFormulario() {
            document.getElementById('produto-form').reset();
            document.getElementById('produto-id').value = '';
            document.getElementById('form-title').innerText = "Cadastrar Novo Produto";
            document.getElementById('btn-salvar').innerText = "Salvar Produto";
            document.getElementById('btn-cancelar').classList.add('hidden');
        }
    </script>
</body>
</html>
